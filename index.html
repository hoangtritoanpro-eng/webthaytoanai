<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Math Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- ==============================================
         KHU VỰC NHÃN DÁN (STICKERS) TRANG TRÍ 
         ============================================== -->
    <!-- Cạnh trái -->
    <i class="fa-solid fa-drafting-compass deco-icon compa"></i>
    <i class="fa-solid fa-earth-americas deco-icon globe"></i>
    <i class="fa-solid fa-calculator deco-icon calc"></i>
    <i class="fa-solid fa-paperclip deco-icon clip-left"></i> <!-- Ghim giấy -->
    <i class="fa-solid fa-pencil deco-icon pencil-left"></i>
    <i class="fa-solid fa-book-open deco-icon book-bottom"></i> <!-- Quyển sách đang mở -->
    
    <!-- Cạnh phải -->
    <i class="fa-solid fa-rainbow deco-icon rainbow"></i> <!-- Cầu vồng -->
    <i class="fa-solid fa-cloud deco-icon cloud1"></i>
    <i class="fa-solid fa-cloud deco-icon cloud2"></i>
    <i class="fa-solid fa-lightbulb deco-icon bulb"></i>
    <i class="fa-solid fa-pen-ruler deco-icon pen-ruler"></i>
    <i class="fa-solid fa-rocket deco-icon rocket"></i>
    <i class="fa-solid fa-book deco-icon book-right"></i>
    <i class="fa-solid fa-paperclip deco-icon clip-right"></i> <!-- Ghim giấy -->
    <i class="fa-solid fa-face-smile-wink deco-icon cute-face"></i> <!-- Mặt cười dễ thương -->
    
    <!-- Điểm xuyết (Ngôi sao, trái tim bay lơ lửng) -->
    <i class="fa-solid fa-star deco-icon star1"></i>
    <i class="fa-solid fa-star deco-icon star2"></i>
    <i class="fa-solid fa-star deco-icon star3"></i>
    <i class="fa-solid fa-heart deco-icon heart1"></i>
    <i class="fa-solid fa-heart deco-icon heart2"></i>
    <!-- ============================================== -->

    <div class="app">
        <div class="topbar">
            <h1><i class="fa-solid fa-book-open"></i> AI Math <span>Hub</span></h1>
            <p>Không gian học tập tương tác</p>
        </div>
        
        <!-- BỐ CỤC LƯỚI (GRID) -->
        <div class="layout">
            <div class="panel full-panel">
                <h2 class="panel-title"><i class="fa-solid fa-layer-group"></i> Kho Ứng Dụng Của Thầy Toán AI</h2>
                <div class="app-grid" id="app-grid">
                    <!-- Javascript sẽ tự động điền các thẻ vào đây -->
                </div>
            </div>
        </div>
    </div>

    <!-- KHUNG FULLSCREEN -->
    <div id="fullscreen-wrapper" class="fullscreen-wrapper hidden">
        <button id="close-btn" class="close-btn" onclick="closeFullscreen()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại trang vở
        </button>
        <iframe id="app-frame" src="about:blank"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
